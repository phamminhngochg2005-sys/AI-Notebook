<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay AI giáo viên Tiểu học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sổ tay điện tử dạng lật trang: thư viện 80 câu lệnh AI, cá nhân hóa kế hoạch bài dạy, hướng dẫn từng bước và kho bài dạy mẫu cho giáo viên Tiểu học.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap&subset=vietnamese">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Bố cục: một cuốn sổ tay bìa cứng đặt trên bàn làm việc "phòng lab AI".
   Trang giấy chấm lưới (kế thừa giấy kẻ ô + mực bút bi + bóng đổ cứng của Chuyền Tay),
   lật trang 3D theo gáy sách; bìa xanh chàm với mạng nơ-ron phát sáng. */
:root {
  color-scheme: light;
  --desk: #EDF0FB;
  --desk-2: #FFFFFF;
  --desk-line: rgba(70, 54, 245, 0.06);
  --desk-ink: #161A45;
  --desk-ink-2: #5A5E8C;
  --desk-3: #D9DEF5;
  --board: #BCC3F2;
  --board-2: #D9DDFA;

  --paper: #FCFCFF;
  --paper-2: #EEF0FA;
  --dot: #DADDF1;
  --edge: #C9CDE6;
  --card: #FFFFFF;
  --field: #FFFFFF;
  --ink: #161A45;
  --ink-2: #474B78;
  --ink-3: #8084AB;
  --line: #DCDFF1;
  --sh-c: #161A45;

  --pen: #4636F5;
  --pen-2: #3122D6;
  --pen-tint: #E9E7FF;
  --signal: #0E9FBF;
  --signal-tint: #DAF5FB;
  --hl: #FFE45C;
  --hl-tint: #FFF5BF;
  --hl-ink: #161A45;
  --mint: #22B98C;
  --mint-tint: #D5F5EA;
  --stamp: #E8364F;
  --stamp-tint: #FFE3E8;
  --lav-tint: #F0E4FF;

  --cover: #E6E9FF;
  --cover-2: #FFFFFF;
  --cover-ink: #161A45;
  --cover-ink-2: #5A5E8C;
  --cover-line: rgba(70, 54, 245, 0.18);
  --glow: #12AFD3;
  --term: #F5F6FF;
  --term-ink: #161A45;
  --term-dim: #8084AB;
  --qr-bg: #FFFFFF;

  --f-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-sm: 8px;
  --r: 14px;
  --ease: cubic-bezier(.32, .08, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--desk-ink);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1100px 620px at 50% 46%, var(--desk-2), transparent 72%),
    linear-gradient(var(--desk-line) 1px, transparent 1px) 0 0 / 34px 34px,
    linear-gradient(90deg, var(--desk-line) 1px, transparent 1px) 0 0 / 34px 34px,
    var(--desk);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--pen); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 6px; }
.ico { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.18em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Thanh trên ---------- */
.bar { display: flex; align-items: center; gap: 14px; min-height: 62px; position: relative; z-index: 30; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: var(--desk-ink); }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--pen); display: grid; place-items: center; flex: none; box-shadow: 2px 2px 0 var(--sh-c); position: relative; }
.brand-mark svg { width: 22px; height: 22px; stroke: #fff; }
.brand-mark::after { content: ""; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.brand b { display: block; font: 800 17px/1.1 var(--f-display); }
.brand b span { color: var(--pen); }
.brand small { display: block; font-size: 11.5px; color: var(--desk-ink-2); max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav button { border: 0; background: none; color: var(--desk-ink-2); padding: 7px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.nav button:hover { color: var(--desk-ink); background: var(--desk-3); }
.nav button.on { color: var(--pen); background: var(--pen-tint); box-shadow: inset 0 -2px 0 var(--pen); }
.bar-btn { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--desk-3); background: var(--paper); color: var(--desk-ink); padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.bar-btn:hover { border-color: var(--pen); }
.menu-btn { display: none; margin-left: auto; }
.menu { position: absolute; top: 58px; right: 0; width: min(320px, 100%); background: var(--paper); color: var(--ink); border: 2px solid var(--sh-c); border-radius: 14px; box-shadow: 4px 4px 0 var(--sh-c); padding: 8px; display: grid; gap: 2px; }
.menu button { display: flex; align-items: baseline; gap: 10px; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.menu button small { font: 600 11px var(--f-mono); color: var(--ink-3); width: 22px; }
.menu button:hover, .menu button.on { background: var(--pen-tint); }

/* ---------- Sân khấu + sổ ---------- */
.stage { position: relative; display: grid; place-items: center; min-height: 0; padding-block: 16px 20px; padding-right: 54px; }
.book { position: relative; width: min(1200px, 100%); height: min(100%, 800px); perspective: 2800px; transition: transform .9s var(--ease); }
.book::before { /* bìa cứng phía sau các trang */
  content: ""; position: absolute; inset: -11px -12px -13px -12px; border-radius: 16px;
  background: linear-gradient(160deg, var(--board-2), var(--board)); z-index: 0;
  box-shadow: 0 28px 60px rgba(40, 46, 120, .22), 0 6px 14px rgba(40, 46, 120, .12), inset 0 0 0 1px rgba(255,255,255,.5);
  transition: left .9s var(--ease);
}
.book.closed { transform: translateX(-25%); }
.book.closed::before { left: calc(50% - 4px); }
.spine { position: absolute; left: 50%; top: -11px; bottom: -13px; width: 26px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(22,26,69,.2), rgba(255,255,255,.35) 45%, rgba(22,26,69,.2)); z-index: 0; border-radius: 4px; transition: opacity .4s; }
.book.closed .spine { opacity: 0; }

.page {
  position: absolute; top: 0; bottom: 0; width: 50%; z-index: 1; overflow: hidden; color: var(--ink);
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
  background-size: 18px 18px;
}
#pL { left: 0; border-radius: 10px 2px 2px 10px; box-shadow: -2px 1px 0 var(--paper-2), -3px 1px 0 var(--edge), -5px 2px 0 var(--paper-2), -6px 2px 0 var(--edge), -8px 3px 0 var(--paper-2), -9px 3px 0 var(--edge); }
#pR { right: 0; border-radius: 2px 10px 10px 2px; box-shadow: 2px 1px 0 var(--paper-2), 3px 1px 0 var(--edge), 5px 2px 0 var(--paper-2), 6px 2px 0 var(--edge), 8px 3px 0 var(--paper-2), 9px 3px 0 var(--edge); }
.book.closed #pL { visibility: hidden; transition: visibility 0s .9s; }
.page.left::before, .page.right::before, .face.left::before, .face.right::before { content: ""; position: absolute; top: 0; bottom: 0; width: 56px; pointer-events: none; z-index: 3; }
.page.left::before, .face.left::before { right: 0; background: linear-gradient(to left, rgba(16, 20, 70, .16), rgba(16,20,70,.04) 40%, transparent); }
.page.right::before, .face.right::before { left: 0; background: linear-gradient(to right, rgba(16, 20, 70, .16), rgba(16,20,70,.04) 40%, transparent); }
.page::after, .face::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58px; background: linear-gradient(transparent, var(--paper) 55%); pointer-events: none; z-index: 2; }
.page.cover::after, .face.cover::after, .page.endpaper::after, .face.endpaper::after { display: none; }

.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 26px 42px 60px; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
.page.left .scroll, .face.left .scroll { padding-right: 50px; }
.page.right .scroll, .face.right .scroll { padding-left: 50px; }
.runhead { display: flex; justify-content: space-between; gap: 12px; font: 600 10.5px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-bottom: 10px; border-bottom: 1.5px dashed var(--line); margin-bottom: 22px; }
.runhead b { color: var(--pen); font-weight: 600; }
.folio { position: absolute; bottom: 14px; left: 42px; right: 42px; display: flex; justify-content: space-between; font: 600 11px var(--f-mono); color: var(--ink-3); z-index: 4; pointer-events: none; }
.page.left .folio, .face.left .folio { justify-content: flex-start; gap: 14px; }
.page.right .folio, .face.right .folio { justify-content: flex-end; gap: 14px; }
.corner { position: absolute; bottom: 0; width: 44px; height: 44px; border: 0; padding: 0; z-index: 5; background: transparent; }
.corner::before { content: ""; position: absolute; inset: 0; transition: transform .25s var(--ease); }
.corner.next { right: 0; }
.corner.next::before { background: linear-gradient(315deg, transparent 49%, var(--edge) 50%, var(--paper-2) 62%, var(--paper) 100%); border-top-left-radius: 8px; box-shadow: -2px -2px 6px rgba(16,20,70,.12); transform-origin: bottom right; transform: scale(.55); }
.corner.prev { left: 0; }
.corner.prev::before { background: linear-gradient(45deg, transparent 49%, var(--edge) 50%, var(--paper-2) 62%, var(--paper) 100%); border-top-right-radius: 8px; box-shadow: 2px -2px 6px rgba(16,20,70,.12); transform-origin: bottom left; transform: scale(.55); }
.corner:hover::before, .corner:focus-visible::before { transform: scale(1.15); }

/* Lá đang lật */
.leaf { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 20; transform-style: preserve-3d; pointer-events: none; }
.leaf.fwd { left: 50%; transform-origin: left center; }
.leaf.bwd { left: 0; transform-origin: right center; }
.leaf.solo { left: 0; width: 100%; transform-origin: left center; }
.face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; color: var(--ink); background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; }
.face.back { transform: rotateY(180deg); }
.face.right { border-radius: 2px 10px 10px 2px; }
.face.left { border-radius: 10px 2px 2px 10px; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(22,26,69,.0), rgba(22,26,69,.3)); opacity: 0; z-index: 6; pointer-events: none; }
.leaf .corner { display: none; }

/* Dấu trang bên mép sổ */
.tabs { position: absolute; left: 100%; top: 54px; display: flex; flex-direction: column; gap: 7px; z-index: -1; transition: opacity .4s; }
.book.closed .tabs { opacity: 0; pointer-events: none; }
.tab { writing-mode: vertical-rl; border: 0; padding: 14px 7px 14px 9px; margin-left: 2px; border-radius: 0 10px 10px 0; font: 700 12px/1 var(--f-body); color: var(--hl-ink); letter-spacing: .02em; transform: translateX(10px); transition: transform .25s var(--ease), filter .2s; box-shadow: 2px 2px 0 rgba(22,26,69,.22); }
.tab:hover { transform: translateX(14px); }
.tab.on { transform: translateX(18px); filter: saturate(1.2); }
.tab:nth-child(1) { background: #C9C3FF; }
.tab:nth-child(2) { background: #FFE45C; }
.tab:nth-child(3) { background: #8EEBD3; }
.tab:nth-child(4) { background: #9FE6F6; }
.tab:nth-child(5) { background: #FFB8C4; }
.tab:nth-child(6) { background: #E3CCFF; }

/* ---------- Điều khiển dưới ---------- */
.ctrl { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 62px; padding-bottom: 4px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--sh-c); background: var(--paper); box-shadow: 2px 2px 0 var(--sh-c); color: var(--desk-ink); display: grid; place-items: center; }
.round:hover:not(:disabled) { background: var(--pen); color: #fff; }
.round:disabled { opacity: .35; cursor: default; }
.where { min-width: 0; text-align: center; display: grid; gap: 6px; justify-items: center; }
.where b { font: 700 14px/1.2 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.where small { font: 600 11px var(--f-mono); color: var(--desk-ink-2); letter-spacing: .06em; }
.dots { display: flex; gap: 6px; }
.dots button { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: var(--desk-3); transition: width .3s var(--ease), background .3s; }
.dots button.on { width: 26px; background: var(--pen); }

/* ---------- Bìa ---------- */
.page.cover, .face.cover { background: radial-gradient(420px 300px at 60% 28%, rgba(18,175,211,.14), transparent 70%), linear-gradient(155deg, var(--cover-2), var(--cover) 70%); color: var(--cover-ink); border-radius: 3px 14px 14px 3px; }
.page.cover::before, .face.cover::before { left: 0; width: 22px; background: linear-gradient(90deg, rgba(22,26,69,.14), rgba(255,255,255,.4) 60%, transparent); }
.cover-in { position: absolute; inset: 0; overflow-y: auto; padding: 30px 36px 30px 46px; display: flex; flex-direction: column; gap: 16px;
  background-image: linear-gradient(rgba(70,54,245,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(70,54,245,.05) 1px, transparent 1px); background-size: 26px 26px; }
.cover-frame { position: absolute; inset: 14px 14px 14px 26px; border: 1.5px solid var(--cover-line); border-radius: 10px; pointer-events: none; }
.cover-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cover-ink-2); }
.badge { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--pen); background: var(--pen-tint); color: var(--pen); padding: 5px 10px; border-radius: 99px; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.art { width: 100%; max-width: 420px; align-self: center; flex: 1 1 auto; min-height: 140px; max-height: 270px; }
.cover h1 { font: 800 clamp(22px, 2.3vw, 31px)/1.16 var(--f-display); letter-spacing: -0.015em; }
.cover h1 .hl { color: var(--pen); background: linear-gradient(transparent 62%, var(--hl) 62%, var(--hl) 92%, transparent 92%); padding: 0 3px; }
.cover-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; border-top: 1.5px dashed var(--cover-line); padding-top: 14px; }
.cover-meta small { display: block; font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cover-ink-2); margin-bottom: 3px; }
.cover-meta b { font-size: 14px; font-weight: 600; }
.cover-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.cover-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 18px; font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--cover-ink-2); padding-top: 4px; }
.cover-foot span::before { content: "◆ "; color: var(--pen); }
.endpaper-in { position: absolute; inset: 0; background: radial-gradient(circle at 20px 20px, rgba(70,54,245,.18) 2px, transparent 2.5px) 0 0 / 40px 40px, linear-gradient(155deg, var(--cover), var(--cover-2)); display: grid; place-items: center; color: var(--cover-ink-2); font: 600 12px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }
.art .n { fill: var(--glow); }
.art .ln { stroke: var(--pen); stroke-opacity: .35; stroke-width: 1.4; fill: none; }
.art .flow { stroke: var(--glow); stroke-width: 1.6; fill: none; stroke-dasharray: 3 7; animation: flow 2.2s linear infinite; }
.art .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flow { to { stroke-dashoffset: -40; } }
@keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* ---------- Thành phần trên trang ---------- */
.eyebrow { font: 600 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pen); }
.pt { font: 800 clamp(24px, 2.4vw, 33px)/1.08 var(--f-display); margin-top: 6px; }
.lede { color: var(--ink-2); margin-top: 8px; max-width: 62ch; }
.mark { background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 88%, transparent 88%); color: inherit; padding: 0 2px; }
.ph-head { margin-bottom: 18px; }
.sec { margin-top: 22px; }
.sec > h3 { font: 700 15px/1.3 var(--f-display); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.sec > h3 .num { font: 600 11px var(--f-mono); color: var(--pen); background: var(--pen-tint); border-radius: 6px; padding: 3px 6px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.note { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--sh-c); background: var(--card); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; box-shadow: 2px 2px 0 var(--sh-c); transition: transform .12s, box-shadow .12s, background .12s; text-decoration: none; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--sh-c); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--sh-c); }
.btn-primary { background: var(--pen); color: #fff; }
.btn-primary:hover { background: var(--pen-2); }
.btn-hl { background: var(--hl); color: var(--hl-ink); }
.btn-signal { background: var(--pen); color: #fff; border-color: var(--sh-c); box-shadow: 3px 3px 0 var(--sh-c); }
.btn-signal:hover { background: var(--pen-2); }
.btn-line { background: var(--paper); color: var(--cover-ink); }
.btn-sm { min-height: 34px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
.btn.done { background: var(--mint); color: #0B0F2A; }
.lnk { border: 0; background: none; padding: 0; color: var(--pen); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
.lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.subj { background: var(--pen-tint); color: var(--pen); border-color: transparent; }
.tag.pur-draft { background: var(--signal-tint); color: var(--signal); border-color: transparent; }
.tag.pur-adapt { background: var(--hl-tint); color: var(--ink); border-color: transparent; }
.tag.pur-review { background: var(--mint-tint); color: var(--mint); border-color: transparent; }
.tag.pur-materials { background: var(--lav-tint); color: var(--pen); border-color: transparent; }
.tag.alt { background: var(--stamp-tint); color: var(--stamp); border-color: transparent; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--pen); color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip.on::before { content: "✓"; font-size: 11px; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > span, .flabel { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field > span em { font-style: normal; color: var(--stamp); }
.in, select.in, textarea.in { width: 100%; min-height: 40px; border: 2px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 11px; font-size: 14px; color: var(--ink); }
textarea.in { min-height: 70px; resize: vertical; line-height: 1.5; }
.in:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-tint); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--line); border-radius: 11px; overflow: hidden; }
.seg button { border: 0; background: var(--field); padding: 8px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); line-height: 1.3; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.on { background: var(--pen); color: #fff; }

.search { position: relative; display: block; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search .in { padding-left: 38px; min-height: 46px; border-color: var(--ink); box-shadow: 2px 2px 0 var(--sh-c); }
.search .in:focus { box-shadow: 2px 2px 0 var(--sh-c), 0 0 0 4px var(--pen-tint); }
.filters { position: sticky; top: -26px; z-index: 3; margin: 0 -10px; padding: 12px 10px 12px; background: linear-gradient(var(--paper) 88%, transparent); display: grid; gap: 9px; }

/* Thư viện câu lệnh */
.count { font: 600 11.5px var(--f-mono); color: var(--ink-3); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
.plist { display: grid; gap: 10px; }
.pcard { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 14px; display: grid; gap: 7px; transition: border-color .15s, box-shadow .15s; }
.pcard:hover { border-color: var(--ink-3); }
.pcard.on { border-color: var(--pen); box-shadow: 3px 3px 0 var(--pen); }
.pcard h3 { font: 700 15.5px/1.3 var(--f-display); }
.pcard p { font-size: 13.5px; color: var(--ink-2); }
.pc-top { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pc-top .id { margin-left: auto; font: 600 10.5px var(--f-mono); color: var(--ink-3); }
.pc-act { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); margin-top: 2px; }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 24px; text-align: center; color: var(--ink-2); }

.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: h; }
.howto li { counter-increment: h; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; }
.howto li::before { content: counter(h); width: 26px; height: 26px; border-radius: 8px; background: var(--hl); color: var(--hl-ink); display: grid; place-items: center; font: 700 12.5px var(--f-mono); border: 1.5px solid var(--sh-c); }
.term { background: var(--term); color: var(--term-ink); border-radius: 14px; overflow: hidden; border: 2px solid var(--sh-c); box-shadow: 3px 3px 0 var(--sh-c); }
.term-bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1.5px solid var(--line); background: var(--paper-2); font: 600 11px var(--f-mono); color: var(--term-dim); }
.term-bar i { width: 9px; height: 9px; border-radius: 50%; background: #FF6B80; display: block; }
.term-bar i:nth-child(2) { background: #FFE45C; } .term-bar i:nth-child(3) { background: #3DDBB0; }
.term-bar span { margin-left: 8px; }
.term pre { margin: 0; padding: 14px 16px 16px; white-space: pre-wrap; word-break: break-word; font: 400 12.8px/1.65 var(--f-mono); max-height: none; }
.term mark { background: var(--hl-tint); color: var(--ink); box-shadow: inset 0 -2px 0 var(--hl); border-radius: 3px; padding: 0 2px; }
.term .k { color: var(--pen); font-weight: 600; }

/* Cá nhân hóa */
.fgroup { border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--card); margin-top: 12px; }
.fgroup > legend, .fgroup > .fg-h { font: 700 13.5px var(--f-display); display: flex; align-items: center; gap: 8px; }
.fg-h .num { font: 600 11px var(--f-mono); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 2px 6px; }
.example-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--hl-tint); border: 1.5px solid var(--hl); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.meter { height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--pen), var(--glow)); border-radius: 99px; transition: width .35s var(--ease); }
.ai-links { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.ai-links a { display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 11px; padding: 9px 6px; font-weight: 600; font-size: 13px; color: var(--ink); text-decoration: none; }
.ai-links a:hover { border-color: var(--pen); }
.base-pill { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 2px dashed var(--pen); border-radius: 12px; padding: 9px 12px; font-size: 13px; background: var(--pen-tint); }
.outline { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.outline li { display: flex; gap: 10px; font-size: 13.5px; align-items: baseline; }
.outline b { font: 700 12px var(--f-mono); color: var(--pen); width: 26px; flex: none; }

/* Hướng dẫn */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 19px; top: 24px; bottom: 24px; width: 2px; background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 11px); }
.step-btn { position: relative; width: 100%; display: grid; grid-template-columns: 40px 1fr; gap: 12px; text-align: left; border: 0; background: none; padding: 10px 8px 10px 0; border-radius: 12px; }
.step-btn .sn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 15px var(--f-mono); background: var(--card); border: 2px solid var(--line); z-index: 1; }
.step-btn b { font: 700 15px/1.3 var(--f-display); display: block; }
.step-btn small { color: var(--ink-2); font-size: 13px; display: block; margin-top: 2px; }
.step-btn:hover .sn { border-color: var(--pen); }
.step-btn.on .sn { background: var(--pen); color: #fff; border-color: var(--sh-c); box-shadow: 2px 2px 0 var(--sh-c); }
.step-btn.on b { color: var(--pen); }
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; border: 2px solid var(--sh-c); box-shadow: 3px 3px 0 var(--sh-c); background: radial-gradient(400px 200px at 70% 20%, rgba(18,175,211,.18), transparent), linear-gradient(140deg, var(--cover-2), var(--cover)); color: var(--cover-ink); display: grid; place-items: center; width: 100%; padding: 0; }
.video .play { width: 58px; height: 58px; border-radius: 50%; background: var(--pen); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 8px var(--pen-tint); }
.video .vcap { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; justify-content: space-between; gap: 8px; font: 600 11.5px var(--f-mono); text-align: left; }
.video .vtitle { position: absolute; left: 14px; top: 12px; font: 700 14px var(--f-display); text-align: left; max-width: 80%; }
.big-n { font: 800 64px/0.9 var(--f-display); color: var(--pen); -webkit-text-stroke: 0; }
.shot { border: 2px solid var(--sh-c); border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: 3px 3px 0 var(--sh-c); }
.shot-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--paper-2); border-bottom: 1.5px solid var(--line); font: 600 11px var(--f-mono); color: var(--ink-3); }
.shot-bar .url { flex: 1; background: var(--card); border-radius: 7px; padding: 4px 9px; border: 1px solid var(--line); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot-body { padding: 14px; display: grid; gap: 10px; font-size: 13px; }
.bubble { border-radius: 12px; padding: 9px 12px; max-width: 88%; line-height: 1.5; }
.bubble.me { background: var(--pen); color: #fff; justify-self: end; border-bottom-right-radius: 4px; }
.bubble.ai { background: var(--paper-2); border-bottom-left-radius: 4px; }
.bubble.ai b { color: var(--pen); }
.cursor { display: inline-block; width: 18px; height: 18px; vertical-align: middle; }
.qrs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.qr { display: grid; gap: 6px; justify-items: center; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: none; }
.qr .qbox { background: var(--qr-bg); padding: 6px; border-radius: 10px; border: 2px solid var(--sh-c); width: 100%; max-width: 116px; aspect-ratio: 1; }
.qr .qbox svg { width: 100%; height: 100%; display: block; }
.qr small { font: 400 11px var(--f-mono); color: var(--ink-3); }
.tips { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.tips li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; }
.tips li .ico { color: var(--mint); margin-top: 3px; }
.warn { background: var(--stamp-tint); border-left: 4px solid var(--stamp); border-radius: 0 12px 12px 0; padding: 10px 14px; font-size: 13.5px; }
.warn b { color: var(--stamp); }
.okbox { background: var(--mint-tint); border-left: 4px solid var(--mint); border-radius: 0 12px 12px 0; padding: 10px 14px; font-size: 13.5px; }

/* Kho bài mẫu */
.lcard { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.lcard:hover { border-color: var(--ink-3); }
.lcard.on { border-color: var(--pen); box-shadow: 3px 3px 0 var(--pen); }
.lcard h3 { font: 700 15px/1.3 var(--f-display); }
.lcard p { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cv-box { border: 2px solid var(--sh-c); border-radius: 14px; padding: 14px; background: var(--hl-tint); }
.cv-box ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 3px; font-size: 13.5px; }
.khbd-h { text-align: center; border: 2px solid var(--sh-c); border-radius: 14px; padding: 14px; background: var(--card); box-shadow: 3px 3px 0 var(--sh-c); }
.khbd-h small { font: 600 10.5px var(--f-mono); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.khbd-h h3 { font: 800 19px/1.2 var(--f-display); margin: 4px 0 6px; }
.khbd-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.khbd-meta b { color: var(--ink); }
.ltabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0 6px; border-bottom: 2px solid var(--line); }
.ltabs button { border: 0; background: none; padding: 8px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.ltabs button.on { color: var(--pen); border-bottom-color: var(--pen); }
.roman { font: 700 15px var(--f-display); margin: 18px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.roman span { font: 700 12px var(--f-mono); color: var(--pen); }
.goals { white-space: pre-line; font-size: 14px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.act { border-left: 3px solid var(--pen); padding: 4px 0 4px 14px; margin-bottom: 14px; }
.act-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.act-h b { font: 700 14.5px/1.3 var(--f-display); }
.act-h .min { font: 600 11.5px var(--f-mono); background: var(--ink); color: var(--paper); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.act dl { margin: 8px 0 0; display: grid; gap: 6px; }
.act dt { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.act dd { margin: 0; font-size: 13.5px; }
.sheet { white-space: pre-wrap; font: 400 13.5px/1.9 var(--f-body); background-color: var(--card); background-image: linear-gradient(transparent calc(100% - 1px), var(--line) 0); background-size: 100% 25.6px; border: 2px solid var(--sh-c); border-radius: 12px; padding: 14px 16px; box-shadow: 3px 3px 0 var(--sh-c); }
.qlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: q; }
.qlist li { counter-increment: q; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 44px; position: relative; font-size: 14px; }
.qlist li::before { content: "?" counter(q); position: absolute; left: 10px; top: 10px; font: 700 11px var(--f-mono); color: var(--pen); background: var(--pen-tint); border-radius: 6px; padding: 2px 5px; }
.blank-lines { height: 72px; background-image: linear-gradient(transparent calc(100% - 1px), var(--line) 0); background-size: 100% 24px; }

/* Đối chiếu */
.check { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--pen); }
.check:has(input:checked) { border-color: var(--mint); background: var(--mint-tint); }
.check small { display: block; color: var(--ink-2); font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; border: 2px solid var(--sh-c); border-radius: 12px; background: var(--card); }
table.ksb { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
.ksb th, .ksb td { text-align: left; padding: 9px 10px; border-bottom: 1.5px solid var(--line); vertical-align: top; }
.ksb th { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--paper-2); }
.ksb tr:last-child td { border-bottom: 0; }
.verdict { font: 700 11px var(--f-mono); padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.v-keep { background: var(--mint-tint); color: var(--mint); }
.v-edit { background: var(--hl); color: var(--hl-ink); }
.v-drop { background: var(--stamp-tint); color: var(--stamp); }
dl.info { margin: 0; display: grid; gap: 10px; }
dl.info div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
dl.info dt { color: var(--ink-3); font-size: 12.5px; font-weight: 600; }
dl.info dd { margin: 0; font-weight: 500; }
.pending { color: var(--ink-3); font-style: italic; }
.fin { text-align: center; margin-top: 26px; display: grid; gap: 10px; justify-items: center; }
.fin .orn { font: 600 11px var(--f-mono); letter-spacing: .3em; color: var(--ink-3); }

/* Giới thiệu + mục lục */
.titlebox { border: 2px solid var(--sh-c); border-radius: 16px; padding: 16px 18px; background: var(--card); box-shadow: 4px 4px 0 var(--sh-c); display: grid; gap: 6px; }
.titlebox small { font: 600 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.titlebox .rt { font: 700 18px/1.3 var(--f-display); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); }
.stat b { display: block; font: 800 24px/1 var(--f-display); color: var(--pen); font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--ink-2); line-height: 1.3; display: block; margin-top: 4px; }
.where-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.where-card > div { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); }
.where-card h4 { font: 700 13.5px var(--f-display); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.where-card h4 .ico { color: var(--signal); }
.where-card p { font-size: 13.5px; color: var(--ink-2); }
.toc { list-style: none; margin: 0; padding: 0; display: grid; }
.toc button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: baseline; text-align: left; border: 0; border-bottom: 1.5px dashed var(--line); background: none; padding: 13px 4px; }
.toc button:hover { background: var(--pen-tint); }
.toc .tn { font: 700 13px var(--f-mono); color: var(--pen); }
.toc b { font: 700 16px/1.25 var(--f-display); display: block; }
.toc small { color: var(--ink-2); font-size: 13px; display: block; margin-top: 2px; }
.toc .pg { font: 600 13px var(--f-mono); color: var(--ink-3); }
.keys { display: grid; gap: 8px; font-size: 13.5px; }
.keys div { display: flex; gap: 10px; align-items: center; }
kbd { font: 600 11.5px var(--f-mono); border: 1.5px solid var(--ink-3); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; background: var(--card); }

/* ---------- Quản trị ---------- */
.admin { position: fixed; inset: 0; z-index: 60; background: var(--paper-2); color: var(--ink); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.admin-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.admin-side { background: var(--paper); border-right: 2px solid var(--line); color: var(--cover-ink); padding: 22px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.admin-side .brand small { color: var(--cover-ink-2); }
.admin-side .brand b { color: var(--ink); }
.admin-side nav { display: grid; gap: 2px; margin-top: 18px; }
.admin-side nav span { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--cover-ink-2); }
.admin-side nav span.on { background: var(--pen-tint); color: var(--pen); font-weight: 600; box-shadow: inset 3px 0 0 var(--pen); }
.admin-side nav span em { margin-left: auto; font: 600 10px var(--f-mono); font-style: normal; opacity: .7; }
.admin-main { padding: 26px 28px 40px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.admin-top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.admin-top h2 { font: 800 26px var(--f-display); }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--paper); border: 2px solid var(--sh-c); border-radius: 16px; box-shadow: 4px 4px 0 var(--sh-c); padding: 18px; display: grid; gap: 12px; }
.panel h3 { font: 700 16px var(--f-display); }
.mini-cover, .mini-cover.page { position: relative; top: auto; bottom: auto; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px 14px 14px 6px; overflow: hidden; box-shadow: 0 14px 30px rgba(40,46,120,.2), 0 0 0 1.5px var(--line); }
.mini-cover .cover-in { padding: 20px 20px 20px 30px; gap: 10px; }
.mini-cover .cover-frame { inset: 10px 10px 10px 20px; }
.mini-cover h1 { font-size: clamp(16px, 1.7vw, 21px); }
.mini-cover .art { max-height: 160px; min-height: 90px; }
.mini-cover .cover-meta b { font-size: 12px; }
.login { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(800px 400px at 50% 30%, var(--desk-2), transparent), var(--desk); }
.login .panel { width: min(400px, 100%); }
.demo-note { font: 600 11.5px var(--f-mono); background: var(--hl); color: var(--hl-ink); padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--sh-c); }

/* ---------- Toast ---------- */
#toasts { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--paper); color: var(--ink); border: 2px solid var(--sh-c); box-shadow: 3px 3px 0 var(--sh-c); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; animation: tin .25s var(--ease); }
.toast .ico { color: var(--mint); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Màn hình hẹp ---------- */
@media (max-width: 1180px) { .nav { display: none; } .menu-btn { display: inline-flex; } }
@media (max-width: 959px) {
  .stage { padding-right: 0; padding-block: 6px 4px; }
  .book { width: 100%; max-width: 680px; height: 100%; }
  .book.closed { transform: none; }
  .book.closed::before { left: -8px; }
  .book::before { inset: -6px -8px -8px -8px; }
  .spine, .tabs, .corner { display: none; }
  #pL { display: none; }
  #pR { left: 0; right: 0; width: 100%; border-radius: 4px 12px 12px 4px; }
  .page.right::before { width: 22px; }
  .scroll, .page.right .scroll { padding: 20px 20px 56px 26px; }
  .folio { left: 24px; right: 20px; }

function copyText(text, btn) {
  const done = () => {

  };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); ok ? done() : toast('Trình duyệt chặn sao chép. Hãy bôi đen câu lệnh và nhấn Ctrl/⌘ + C.');

}

function buildPrompt() {
  const b = S.b, base = b.base && P.find(p => p.id === b.base);

  const lacks = ['Máy chiếu / Tivi', 'Máy in', 'Internet ổn định'].filter(x => !b.equip.includes(x));
  const task = { draft: 'Soạn bản dự thảo kế hoạch bài dạy', adapt: 'Điều chỉnh kế hoạch bài dạy dưới đây cho phù hợp điều kiện thực tế', review: 'Rà soát kế hoạch bài dạy dưới đây, chỉ ra điểm cần sửa và đề xuất cách sửa', materials: 'Thiết kế phiếu học tập, câu hỏi và học liệu đơn giản' }[b.purpose];
  const lines = [
    'Bạn là chuyên gia hỗ trợ giáo viên Tiểu học xây dựng kế hoạch bài dạy theo Chương trình GDPT 2018 và khung kế hoạch bài dạy tham khảo tại Phụ lục 3, Công văn 2345/BGDĐT-GDTH.',
    '',
    `NHIỆM VỤ: ${task} cho bài "${v(b.title, 'tên bài')}", môn ${b.subj}, lớp ${b.grade}, thời lượng ${b.dur} phút.`,
    `YÊU CẦU CẦN ĐẠT: ${v(b.goal, 'dán yêu cầu cần đạt kèm nguồn')}`,
    '',
    'BỐI CẢNH LỚP HỌC THỰC TẾ:',
    `- Sĩ số: ${v(b.size, 'sĩ số')} học sinh${b.conds.length ? '; điều kiện: ' + b.conds.join(', ').toLowerCase() : ''}${b.condNote ? '; ' + b.condNote : ''}.`,
    `- Đặc điểm học sinh: ${v(b.traits, 'đặc điểm học sinh')}`,
    `- Năng lực tiếng Việt: ${b.lang.toLowerCase()}${b.home ? '; ngôn ngữ ở nhà: ' + b.home : ''}.`,
    `- Thiết bị, học liệu đang có: ${b.equip.length ? b.equip.join(', ') : '[liệt kê học liệu]'}${b.equipNote ? '. ' + b.equipNote : ''}.`,
    lacks.length ? `- KHÔNG có: ${lacks.join(', ')}.` : null,
    (b.purpose === 'adapt' || b.purpose === 'review') ? `\nKẾ HOẠCH HIỆN CÓ:\n${v(b.source, 'dán kế hoạch hoặc hoạt động hiện có')}` : null,
    base ? `\nTHAM KHẢO CÂU LỆNH MẪU #${base.id.slice(1)} "${base.title}":\n${base.text}` : null,
    '',
    'TRÌNH BÀY: I. Yêu cầu cần đạt; II. Đồ dùng dạy học; III. Các hoạt động dạy học chủ yếu (mỗi hoạt động ghi thời gian, việc của giáo viên, việc của học sinh, sản phẩm/cách đánh giá); IV. Điều chỉnh sau bài dạy (để trống).',
    `RÀNG BUỘC: chỉ dùng thiết bị, học liệu đã liệt kê; tổng thời gian đúng ${b.dur} phút; câu chỉ dẫn ngắn, có khung câu hỗ trợ tiếng Việt; ví dụ gần gũi với đời sống địa phương; không tự bịa số trang, số liệu. Nếu thiếu thông tin, hãy hỏi lại tôi trước khi soạn.`,
    'Tôi sẽ kiểm tra, chỉnh sửa trước khi sử dụng.',
  ];
  return lines.filter(x => x !== null).join('\n');
}
function fillScore() {
  const b = S.b; const keys = [b.title, b.goal, b.traits, b.size, b.home, b.equip.length, b.lang];
  return Math.round(keys.filter(Boolean).length / keys.length * 100);
}
function outHTML() {
  const b = S.b, base = b.base && P.find(p => p.id === b.base), sc = fillScore();

/* ================= Dựng trang & lật trang ================= */
const book = $('#book'), pL = $('#pL'), pR = $('#pR');
const mqWide = matchMedia('(min-width: 960px)');
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const isWide = () => mqWide.matches;
let busy = false;

function pageClass(sp, side) {
  if (sp === 0) return side === 'L' ? 'endpaper' : 'cover';
  return '';
}
function pageInner(sp, side) {
  if (sp === 0) return side === 'L' ? `<div class="endpaper-in">${E(CFG.shortName || 'Sổ tay AI')}</div>` : coverHTML();
  const corner = side === 'L' ? `<button class="corner prev" type="button" data-go="${sp - 1}" aria-label="Lật về trang trước"></button>` : side === 'R' && sp < LAST ? `<button class="corner next" type="button" data-go="${sp + 1}" aria-label="Lật sang trang sau"></button>` : '';
  let inner;
  if (side === 'M') inner = `<div>${CONTENT[sp][0]()}</div><hr style="border:0;border-top:1.5px dashed var(--line);margin:28px 0"><div>${CONTENT[sp][1]()}</div>`;
  else inner = CONTENT[sp][side === 'L' ? 0 : 1]();
  const folio = side === 'M' ? `<div class="folio"><span>${E(CH[sp].s)}</span><span>tr. ${pageNo(sp, 'L')}–${pageNo(sp, 'R')}</span></div>`
    : side === 'L' ? `<div class="folio"><span>${pageNo(sp, 'L')}</span><span>${E(CH[sp].s)}</span></div>` : `<div class="folio"><span>${E(CH[sp].s)}</span><span>${pageNo(sp, 'R')}</span></div>`;
  return `<div class="scroll">${runhead(sp, side)}${inner}</div>${folio}${corner}`;
}
function paint(el, sp, side) {
  const real = side === 'M' ? 'right' : side === 'L' ? 'left' : 'right';
  el.className = `page ${real} ${pageClass(sp, side === 'M' ? (sp === 0 ? 'R' : 'M') : side)}`.trim();
  el.innerHTML = pageInner(sp, side === 'M' && sp === 0 ? 'R' : side);
}
function render() {
  book.classList.toggle('closed', S.spread === 0);
  if (isWide()) { paint(pL, S.spread, 'L'); paint(pR, S.spread, 'R'); }
  else { paint(pR, S.spread, 'M'); pL.innerHTML = ''; }
  chrome();
}
function chrome() {
  const sp = S.spread;
  $('#whereT').textContent = CH[sp].t;
  $('#whereP').textContent = sp === 0 ? 'TRANG BÌA' : `TRANG ${pageNo(sp, 'L')}–${pageNo(sp, 'R')} / ${pageNo(LAST, 'R')}`;
  $('#prev').disabled = sp === 0; $('#next').disabled = sp === LAST;
  $('#dots').innerHTML = CH.map((c, i) => `<button type="button" class="${i === sp ? 'on' : ''}" data-go="${i}" aria-label="${E(c.t)}"></button>`).join('');
  $('#nav').innerHTML = CH.slice(1).map((c, i) => `<button type="button" class="${i + 1 === sp ? 'on' : ''}" data-go="${i + 1}">${E(c.s)}</button>`).join('');
  $('#tabs').innerHTML = CH.slice(1).map((c, i) => `<button type="button" class="tab${i + 1 === sp ? ' on' : ''}" data-go="${i + 1}">${E(c.s)}</button>`).join('');
  $('#menu').innerHTML = CH.map((c, i) => `<button type="button" class="${i === sp ? 'on' : ''}" data-go="${i}"><small>${i ? String(i).padStart(2, '0') : '—'}</small>${E(c.t)}</button>`).join('');
  document.querySelectorAll('[data-cfg]').forEach(el => { el.textContent = CFG[el.dataset.cfg] || CFG_DEF[el.dataset.cfg]; });
  const sn = (CFG.shortName || 'Sổ tay AI');
  $('#shortName').innerHTML = /\sAI$/.test(sn) ? `${E(sn.replace(/\sAI$/, ''))} <span>AI</span>` : E(sn);
}
function makeFace(html, cls, back) {
  const f = document.createElement('div');
  f.className = `face ${cls}${back ? ' back' : ''}`;
  f.innerHTML = html + '<div class="shade"></div>';
  f.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  return f;
}
function cloneFace(el, cls) {
  const st = el.querySelector('.scroll, .cover-in')?.scrollTop || 0;
  const f = makeFace(el.innerHTML, cls, false);
  f.querySelectorAll('input, textarea, select').forEach(n => n.setAttribute('tabindex', '-1'));
  requestAnimationFrame(() => { const s = f.querySelector('.scroll, .cover-in'); if (s) s.scrollTop = st; });
  return f;
}
const sideCls = (sp, side) => `${side === 'L' ? 'left' : 'right'} ${pageClass(sp, side)}`.trim();

function go(to) {
  to = Math.max(0, Math.min(LAST, +to));
  $('#menu').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false');
  if (to === S.spread || busy) return;
  const from = S.spread; S.spread = to; setHash();
  if (reduce()) { render(); focusPage(); return; }
  busy = true;
  isWide() ? flipWide(from, to) : flipSolo(from, to);
}
function flipWide(from, to) {
  const fwd = to > from;
  const leaf = document.createElement('div');
  leaf.className = 'leaf ' + (fwd ? 'fwd' : 'bwd'); leaf.setAttribute('aria-hidden', 'true');
  const front = cloneFace(fwd ? pR : pL, fwd ? sideCls(from, 'R') : sideCls(from, 'L'));
  const back = makeFace(pageInner(to, fwd ? 'L' : 'R'), fwd ? sideCls(to, 'L') : sideCls(to, 'R'), true);
  leaf.append(front, back); book.appendChild(leaf);
  if (fwd) paint(pR, to, 'R'); else paint(pL, to, 'L');
  if (from === 0) book.classList.remove('closed');
  if (to === 0) book.classList.add('closed');
  const dur = (from === 0 || to === 0) ? 950 : 820;
  const anim = leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: `rotateY(${fwd ? -180 : 180}deg)` }], { duration: dur, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'forwards' });
  front.querySelector('.shade').animate([{ opacity: 0 }, { opacity: .55 }], { duration: dur / 2, fill: 'forwards' });
  back.querySelector('.shade').animate([{ opacity: .55 }, { opacity: .55, offset: .5 }, { opacity: 0 }], { duration: dur, fill: 'forwards' });
  chrome();
  anim.onfinish = () => {
    if (fwd) paint(pL, to, 'L'); else paint(pR, to, 'R');
    leaf.remove(); busy = false; chrome(); focusPage();
  };
}
function flipSolo(from, to) {
  const fwd = to > from;
  const leaf = document.createElement('div');
  leaf.className = 'leaf solo'; leaf.setAttribute('aria-hidden', 'true');
  if (fwd) {
    leaf.appendChild(cloneFace(pR, sideCls(from, 'R') + (from === 0 ? '' : '')));
    book.appendChild(leaf); paint(pR, to, 'M'); book.classList.toggle('closed', to === 0);
    const a = leaf.animate([{ transform: 'rotateY(0)', opacity: 1 }, { transform: 'rotateY(-95deg)', opacity: 1, offset: .85 }, { transform: 'rotateY(-110deg)', opacity: 0 }], { duration: 640, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' });
    leaf.firstChild.querySelector('.shade').animate([{ opacity: 0 }, { opacity: .5 }], { duration: 640, fill: 'forwards' });
    a.onfinish = () => { leaf.remove(); busy = false; chrome(); focusPage(); };
  } else {
    const tmp = document.createElement('div'); tmp.className = 'page'; tmp.innerHTML = pageInner(to, to === 0 ? 'R' : 'M');
    leaf.appendChild(makeFace(tmp.innerHTML, to === 0 ? 'right cover' : 'right', false)); book.appendChild(leaf);
    const a = leaf.animate([{ transform: 'rotateY(-110deg)', opacity: 0 }, { transform: 'rotateY(-95deg)', opacity: 1, offset: .15 }, { transform: 'rotateY(0)', opacity: 1 }], { duration: 640, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' });
    a.onfinish = () => { paint(pR, to, 'M'); book.classList.toggle('closed', to === 0); leaf.remove(); busy = false; chrome(); focusPage(); };
  }
  chrome();
}
function focusPage() {}

/* hash */
let hashLock = false;
function setHash() { const id = CH[S.spread].id; if (location.hash !== '#' + id) { hashLock = true; try { history.replaceState(null, '', '#' + id); } catch { location.hash = id; } setTimeout(() => hashLock = false, 50); } }

document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-check]'); if (!t) {
    if (!e.target.closest('#menu, #menuBtn')) { $('#menu').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); }
    return;
  }
  if (t.closest('.leaf')) return;
  const d = t.dataset;
  if (t.id === 'prev') return go(S.spread - 1);
  if (t.id === 'next') return go(S.spread + 1);
  if (t.id === 'menuBtn') { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if ('go' in d) return go(d.go);
  if ('admin' in d) return openAdmin();
  if ('pick' in d) { S.pid = d.pick; store.set('pid', S.pid); refreshDetail(); if (!isWide()) $('#pdetail')?.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); else pR.querySelector('.scroll').scrollTop = 0; return; }
  if ('copy' in d) { const p = P.find(x => x.id === d.copy); if (p) copyText(p.text, t); return; }
  if ('use' in d) { S.b.base = d.use; const p = P.find(x => x.id === d.use); if (p) { S.b.subj = p.subject; S.b.grade = String(p.grade); S.b.purpose = p.purpose; } store.set('b', S.b); toast('Đã chọn làm câu lệnh nền'); return go(3); }
  if ('cond' in d) { S.cond = S.cond === d.cond ? '' : d.cond; refreshLibrary(); return; }
  if ('resetFilter' in d) { S.q = S.subj = S.grade = S.purpose = S.cond = ''; ['#q', '#fSubj', '#fGrade', '#fPurpose'].forEach(s => { const el = $(s); if (el) el.value = ''; }); refreshLibrary(); return; }
  if ('equip' in d || 'bcond' in d) { const key = 'equip' in d ? 'equip' : 'conds', v = d.equip ?? d.bcond; const arr = S.b[key]; const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); t.classList.toggle('on', i < 0); t.setAttribute('aria-pressed', String(i < 0)); S.bIsExample = false; refreshOut(); return; }
  if ('lang' in d) { S.b.lang = d.lang; t.parentElement.querySelectorAll('button').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); S.bIsExample = false; refreshOut(); return; }
  if ('bclear' in d) { S.b = JSON.parse(JSON.stringify(B_EMPTY)); S.bIsExample = false; store.set('b', S.b); store.set('bex', false); rerenderSpread(); toast('Đã xóa ví dụ. Hãy nhập thông tin lớp của bạn.'); return; }
  if ('bexample' in d) { S.b = JSON.parse(JSON.stringify(B_EXAMPLE)); S.bIsExample = true; store.set('b', S.b); store.set('bex', true); rerenderSpread(); return; }
  if ('unbase' in d) { S.b.base = null; refreshOut(); return; }
  if ('copyOut' in d) { copyText(buildPrompt(), t); return; }
  if ('step' in d) { S.step = +d.step; document.querySelectorAll('[data-step].step-btn').forEach(b => { const on = +b.dataset.step === S.step; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); const sd = $('#stepDetail'); if (sd) { sd.innerHTML = stepDetailHTML(); if (!isWide()) sd.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); else pR.querySelector('.scroll').scrollTop = 0; } return; }
  if ('video' in d) { toast('Video hướng dẫn sẽ được nhóm bổ sung trong bản chính thức.'); return; }
  if ('lsubj' in d) { S.lsubj = d.lsubj; rerenderSpread(); return; }
  if ('lesson' in d) { S.lid = d.lesson; S.ltab = 'plan'; document.querySelectorAll('[data-lesson]').forEach(b => b.classList.toggle('on', b.dataset.lesson === S.lid)); const ld = $('#ldetail'); if (ld) { ld.innerHTML = lessonDetailHTML(); if (!isWide()) ld.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); else pR.querySelector('.scroll').scrollTop = 0; } return; }
  if ('ltab' in d) { S.ltab = d.ltab; const ld = $('#ldetail'); if (ld) ld.innerHTML = lessonDetailHTML(); return; }
  if ('copyLesson' in d) { const l = L.find(x => x.id === S.lid); if (l) copyText(lessonText(l), t); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; refreshLibrary(); return; }
  if (t.dataset.b) { S.b[t.dataset.b] = t.value; S.bIsExample = false; if (t.dataset.b === 'purpose') { const f = $('#srcField'); const need = t.value === 'adapt' || t.value === 'review'; if (f) { f.hidden = !need; f.querySelector('span').textContent = 'Dán kế hoạch / hoạt động cần ' + (t.value === 'review' ? 'rà soát' : 'điều chỉnh'); } } refreshOut(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fSubj') { S.subj = t.value; refreshLibrary(); }
  if (t.id === 'fGrade') { S.grade = t.value; refreshLibrary(); }
  if (t.id === 'fPurpose') { S.purpose = t.value; refreshLibrary(); }
  if (t.dataset.check != null && t.type === 'checkbox') {
    S.checks[+t.dataset.check] = t.checked; store.set('checks', S.checks);
    const n = S.checks.filter(Boolean).length, m = $('#chkMeter');
    if (m) { m.querySelector('.flabel').textContent = `Đã kiểm tra ${n}/${CHECKS.length} mục`; m.querySelector('i').style.width = (n / CHECKS.length * 100) + '%'; }
    if (n === CHECKS.length) toast('Đã kiểm tra đủ 7 mục. Kế hoạch sẵn sàng hoàn thiện.');
  }
});
document.addEventListener('keydown', e => {
  if (!$('#admin').hidden) { if (e.key === 'Escape') closeAdmin(); return; }
  if (e.key === 'Escape') { $('#menu').hidden = true; return; }
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(S.spread + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(S.spread - 1); }
});
let tx = null, ty = null;
book.addEventListener('touchstart', e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
book.addEventListener('touchend', e => {
  if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && !e.target.closest('input, textarea, select, .tbl-wrap, .chips')) go(S.spread + (dx < 0 ? 1 : -1));
}, { passive: true });
mqWide.addEventListener?.('change', () => { if (!busy) render(); });

/* ================= Quản trị ================= */
let adminAuthed = false;
function openAdmin() {
  const a = $('#admin'); a.hidden = false;
  hashLock = true; try { history.replaceState(null, '', '#quan-tri'); } catch {} setTimeout(() => hashLock = false, 50);
  adminAuthed ? adminForm() : adminLogin();
}
function closeAdmin() { $('#admin').hidden = true; setHash(); rerenderSpread(); }
function adminLogin() {
  $('#admin').innerHTML = `<div class="login"><form class="panel" id="loginForm" autocomplete="off">
    <div class="brand" style="color:var(--ink)"><span class="brand-mark">${I('book')}</span><span><b style="color:var(--ink)">Quản trị sổ tay</b><small style="color:var(--ink-3)">${E(CFG.shortName || 'Sổ tay AI')}</small></span></div>
    <span class="demo-note">Bản demo · Mật khẩu: admin</span>
    <label class="field"><span>Tài khoản</span><input class="in" id="lgUser" value="nhom-nghien-cuu"></label>
    <label class="field"><span>Mật khẩu</span><input class="in" id="lgPass" type="password" placeholder="admin"></label>
    <p class="small" id="lgErr" style="color:var(--stamp)" hidden>Mật khẩu chưa đúng. Bản demo dùng mật khẩu: admin</p>
    <div class="row"><button class="btn btn-primary" type="submit">Đăng nhập</button><button class="lnk" type="button" data-close-admin>${I('back')} Về sổ tay</button></div>
  </form></div>`;
  $('#lgPass').focus();
  $('#loginForm').addEventListener('submit', ev => { ev.preventDefault(); if ($('#lgPass').value.trim() === 'admin') { adminAuthed = true; adminForm(); } else $('#lgErr').hidden = false; });
}
function adminForm() {
  const draft = Object.assign({}, CFG);
  $('#admin').innerHTML = `<div class="admin-shell">
    <aside class="admin-side"><div class="brand"><span class="brand-mark">${I('book')}</span><span><b>Quản trị</b><small>${E(CFG.shortName || 'Sổ tay AI')}</small></span></div>
      <nav><span class="on">${I('gear')} Thông tin đề tài</span><span>${I('spark')} Câu lệnh <em>${P.length}</em></span><span>${I('book')} Bài dạy mẫu <em>${L.length}</em></span><span>${I('users')} Tài khoản <em>sắp có</em></span></nav>
      <div style="margin-top:auto;padding-top:20px"><button class="btn btn-line btn-sm" type="button" data-close-admin>${I('back')} Về sổ tay</button></div></aside>
    <main class="admin-main">
      <div class="admin-top"><div><p class="eyebrow">Quản trị nội dung</p><h2>Thông tin đề tài & trang bìa</h2></div><div class="row"><button class="btn" type="button" data-admin-reset>Khôi phục mặc định</button><button class="btn btn-primary" type="button" data-admin-save>${I('check')} Lưu thay đổi</button></div></div>
      <p class="demo-note" style="justify-self:start">Bản demo: thay đổi được lưu trên trình duyệt này. Bản chính thức lưu vào máy chủ, áp dụng cho mọi người dùng.</p>
      <div class="admin-grid">
        <form class="panel" id="cfgForm" onsubmit="return false">${CFG_FIELDS.map(([k, label, type, max]) => `<label class="field"><span>${E(label)}</span>${type === 'area' ? `<textarea class="in" id="cfg_${k}" data-cfgk="${k}" maxlength="${max}" rows="${k === 'introduction' || k === 'applicationDescription' ? 4 : 2}">${E(draft[k])}</textarea>` : `<input class="in" id="cfg_${k}" data-cfgk="${k}" maxlength="${max}" value="${E(draft[k])}">`}</label>`).join('')}</form>
        <div class="panel" style="position:sticky;top:16px"><h3>Xem trước trang bìa</h3><div class="mini-cover page cover" id="miniCover">${coverHTML(true)}</div><p class="note">Bìa, trang Giới thiệu đề tài và Phụ lục cập nhật ngay sau khi lưu.</p></div>
      </div>
    </main></div>`;
  const form = $('#cfgForm');
  form.addEventListener('input', ev => { const k = ev.target.dataset.cfgk; if (!k) return; draft[k] = ev.target.value; const save = CFG; CFG = draft; $('#miniCover').innerHTML = coverHTML(true); CFG = save; });
  $('#admin').querySelector('[data-admin-save]').addEventListener('click', () => {
    const clean = {}; for (const [k] of CFG_FIELDS) { const v = String(draft[k] ?? '').trim(); clean[k] = v || CFG_DEF[k]; }
    CFG = clean; store.set('cfg', CFG); chrome(); toast('Đã lưu. Trang bìa và phần giới thiệu đã cập nhật.');
  });
  $('#admin').querySelector('[data-admin-reset]').addEventListener('click', ev => {
    const b = ev.currentTarget;
    if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.textContent = 'Bấm lần nữa để khôi phục'; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = 'Khôi phục mặc định'; } }, 3000); return; }
    CFG = Object.assign({}, CFG_DEF); store.del('cfg'); adminForm(); chrome(); toast('Đã khôi phục thông tin mặc định.');
  });
}
document.addEventListener('click', e => { if (e.target.closest('[data-close-admin]')) closeAdmin(); });

/* ================= Khởi động ================= */
(function init() {
  const h = location.hash.slice(1);
  const i = CH.findIndex(c => c.id === h);
  if (i >= 0) S.spread = i;
  render();
  if (h === 'quan-tri') openAdmin();
})();
})();
</script>
