<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay AI giáo viên Tiểu học</title>
<meta name="description" content="Sổ tay điện tử: thư viện 80 câu lệnh AI, cá nhân hóa kế hoạch bài dạy theo điều kiện thực tế, hướng dẫn từng bước và kho kế hoạch bài dạy mẫu cho giáo viên Tiểu học.">
<meta name="theme-color" content="#EDF0FB">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap&subset=vietnamese">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <button class="brand" type="button" data-go="0" aria-label="Về trang bìa">
    <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24"><path d="M2 5.5C5 4 8.5 4 12 6c3.5-2 7-2 10-.5v13c-3-1.5-6.5-1.5-10 .5-3.5-2-7-2-10-.5z"/><path d="M12 6v13.5"/></svg></span>
    <span><b id="shortName">Sổ tay <span>AI</span></b><small id="productSmall"></small></span>
  </button>
  <nav class="nav" id="nav" aria-label="Chương"></nav>
  <button class="bar-btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Mục lục</span></button>
  <span id="userArea" class="row" style="gap:8px;flex-wrap:nowrap"></span>
  <div class="menu" id="menu" hidden></div>
</header>
<div class="announce" id="announce" hidden></div>

<main class="stage" id="main">
  <div class="book closed" id="book">
    <div class="spine" aria-hidden="true"></div>
    <section class="page left" id="pL" aria-label="Trang trái"></section>
    <section class="page right cover" id="pR" aria-label="Trang phải"><div class="boot" id="boot"><div><i></i>Đang mở sổ tay…</div></div></section>
    <nav class="tabs" id="tabs" aria-label="Dấu trang"></nav>
  </div>
</main>

<footer class="ctrl">
  <button class="round" id="prev" type="button" aria-label="Trang trước"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="where" aria-live="polite"><b id="whereT">Trang bìa</b><div class="dots" id="dots"></div><small id="whereP">BÌA</small></div>
  <button class="round" id="next" type="button" aria-label="Trang sau"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
</footer>
<div id="toasts" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
